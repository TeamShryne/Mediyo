name: Release

# Cutting a release = pushing a tag like v1.2.3 (or Run workflow with a version).
# Produces a signed release APK + update.json for the in-app updater (GitHub only).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 — creates and pushes tag v0.1.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Manual "Run workflow" just cuts the tag; the tag push triggers `build`.
  cut-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semver like 0.1.0 (got '${{ inputs.version }}')"
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Mediyo $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG — the tag build will publish the release."

  build:
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag must be like v1.2.3 (got '$TAG')"
            exit 1
          fi
          CODE=$(( ${BASH_REMATCH[1]} * 1000000 + ${BASH_REMATCH[2]} * 1000 + ${BASH_REMATCH[3]} ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk=mediyo-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "Building $TAG → versionName=$VERSION versionCode=$CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform + build-tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle cache (heavy)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          gradle-home-cache-cleanup: true

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mediyo-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mediyo-release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>&1 | head -3

      - name: Build signed release APK
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleRelease --stacktrace \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.version }}"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mediyo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signature + package
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/apksigner" verify "$APK" # strict: fails if not properly signed
          # NB: aapt exits 1 on the pre-existing @android:drawable/sym_def_app_icon
          # reference, so capture output and assert on what matters instead.
          BADGING=$("$BT/aapt" dump badging "$APK" 2>/dev/null || true)
          echo "$BADGING" | grep -E "^package:|launchable-activity|application-label:" | head -5
          echo "$BADGING" | grep -q "package: name='com.teamshryne.mediyo'" \
            || { echo "::error::unexpected package name"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${{ steps.version.outputs.code }}'" \
            || { echo "::error::unexpected versionCode"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.version }}'" \
            || { echo "::error::unexpected versionName"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Mediyo'" \
            || { echo "::error::unexpected app label"; exit 1; }

      - name: Stage assets + update.json (updater contract)
        id: assets
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          CODE="${{ steps.version.outputs.code }}"
          APK_NAME="${{ steps.version.outputs.apk }}"
          SRC_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC_APK" "$APK_NAME"
          SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          echo "$SHA  $APK_NAME" > "$APK_NAME.sha256"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # update.json: the in-app updater fetches this (or releases/latest)
          # from https://github.com/${{ github.repository }}/releases/download/$TAG/update.json
          cat > update.json <<EOF
          {
            "package": "com.teamshryne.mediyo",
            "version": "$VERSION",
            "versionCode": $CODE,
            "apkName": "$APK_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/$APK_NAME",
            "sha256": "$SHA",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat update.json
          ls -la "$APK_NAME" "$APK_NAME.sha256" update.json

      - name: Changelog since previous tag
        id: changelog
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          {
            echo "log<<EOF"
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"
              git log "$PREV..$TAG" --pretty=format:'- %s (%h)' --reverse
            else
              echo "First release."
              git log "$TAG" --pretty=format:'- %s (%h)' --reverse | head -30
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          CODE="${{ steps.version.outputs.code }}"
          APK_NAME="${{ steps.version.outputs.apk }}"
          SHA="${{ steps.assets.outputs.sha }}"
          # Re-run safe: delete existing release for this tag if present.
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -f -a "$TAG" -m "Mediyo $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Mediyo $TAG" \
            --notes "## Mediyo $TAG (versionCode $CODE)

          ${{ steps.changelog.outputs.log }}

          ### APK
          - **$APK_NAME** — signed release (\`com.teamshryne.mediyo\`), installs side-by-side with the Debug build (\`com.teamshryne.mediyo.debug\`).
          - SHA-256: \`$SHA\`

          ### In-app updater
          This release follows the updater contract (GitHub only, no server):
          - Latest version: \`GET https://api.github.com/repos/${{ github.repository }}/releases/latest\` → \`tag_name\`
          - Machine-readable: \`https://github.com/${{ github.repository }}/releases/download/$TAG/update.json\` (\`versionCode\` to compare, \`apkUrl\` to download, \`sha256\` to verify before install)." \
            "$APK_NAME" "$APK_NAME.sha256" update.json

      - name: Upload APK artifact (CI copy)
        uses: actions/upload-artifact@v4
        with:
          name: mediyo-release-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.version.outputs.apk }}
            update.json
          if-no-files-found: error
