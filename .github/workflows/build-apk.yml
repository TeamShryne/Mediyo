name: Build APK

# Shared by the release and nightly tracks: toolchain, signing, build flags and
# verification, all in one place.
#
# This split is deliberate. The two tracks differ only in version code, tag and
# publish target — everything that decides what the *bytes* are must not
# diverge, or a fix would land in one track's APK and not the other's, and
# nobody would notice until a user reported it.
#
# Callers pass the version code and name in, and publish what this returns.
on:
  workflow_call:
    inputs:
      versionCode:
        description: "Android versionCode to build"
        required: true
        type: string
      versionName:
        description: "Android versionName to build"
        required: true
        type: string
      channel:
        description: "Update track this build belongs to: stable or nightly"
        required: false
        default: stable
        type: string
      apkName:
        description: "Asset name for the published APK"
        required: true
        type: string
    outputs:
      apkName:
        description: "Name of the published asset"
        value: ${{ jobs.build.outputs.apkName }}
      sha256:
        description: "SHA-256 of the built APK"
        value: ${{ jobs.build.outputs.sha256 }}
      versionCode:
        description: "The versionCode that was built"
        value: ${{ jobs.build.outputs.versionCode }}
      versionName:
        description: "The versionName that was built"
        value: ${{ jobs.build.outputs.versionName }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apkName: ${{ steps.meta.outputs.apkName }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      versionCode: ${{ steps.meta.outputs.versionCode }}
      versionName: ${{ steps.meta.outputs.versionName }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform + build-tools + NDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Verify vendored mediyo-core AAR
        run: |
          set -euo pipefail
          test -f app/libs/mediyo.aar || { echo "::error::app/libs/mediyo.aar missing — rebuild it in mediyo-core (make aar) and copy it over"; exit 1; }
          ls -la app/libs/

      - name: Gradle cache (heavy)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          gradle-home-cache-cleanup: true

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mediyo-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mediyo-release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>&1 | head -3

      - name: Build signed release APK
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleRelease --stacktrace \
            -PversionCode="${{ inputs.versionCode }}" \
            -PversionName="${{ inputs.versionName }}" \
            -Pchannel="${{ inputs.channel }}"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mediyo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signature + package
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/apksigner" verify "$APK" # strict: fails if not properly signed
          # NB: aapt exits 1 on the pre-existing @android:drawable/sym_def_app_icon
          # reference, so capture output and assert on what matters instead.
          BADGING=$("$BT/aapt" dump badging "$APK" 2>/dev/null || true)
          echo "$BADGING" | grep -E "^package:|launchable-activity|application-label:" | head -5
          echo "$BADGING" | grep -q "package: name='com.teamshryne.mediyo'" \
            || { echo "::error::unexpected package name"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${{ inputs.versionCode }}'" \
            || { echo "::error::unexpected versionCode"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${{ inputs.versionName }}'" \
            || { echo "::error::unexpected versionName"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Mediyo'" \
            || { echo "::error::unexpected app label"; exit 1; }

      - name: Stage APK
        id: meta
        run: |
          set -euo pipefail
          SRC_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC_APK" "${{ inputs.apkName }}"
          SHA=$(sha256sum "${{ inputs.apkName }}" | cut -d' ' -f1)
          echo "$SHA  ${{ inputs.apkName }}" > "${{ inputs.apkName }}.sha256"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "apkName=${{ inputs.apkName }}" >> "$GITHUB_OUTPUT"
          ls -la "${{ inputs.apkName }}" "${{ inputs.apkName }}.sha256"

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk-${{ inputs.apkName }}
          path: |
            ${{ inputs.apkName }}
            ${{ inputs.apkName }}.sha256
          if-no-files-found: error
          retention-days: 7
