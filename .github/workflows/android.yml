name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request cancels its own superseded runs: a new push is a newer build
  # of the same thing, and only the newest one is worth finishing.
  #
  # A push to main must not. Two merges landed seconds apart once, the second
  # cancelled the first one's check, and the commit it carried went in with the
  # failure never reported. Every push gets its own group, so every one of them
  # reports.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform + build-tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch mediyo-core AAR
        run: ./scripts/fetch-mediyo-core.sh

      # The dependency cache and the Gradle build cache are the whole cost of
      # this job after the first run. `cache-read-only: false` lets a main build
      # write them back so pull requests start warm.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          cache-read-only: false

      - name: Build debug APK + lint
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon --build-cache assembleFossDebug lintFossDebug --stacktrace

      - name: Verify debug identity (side-by-side with release)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)
          echo "APK=$APK"
          BADGING=$("$BT/aapt" dump badging "$APK" 2>/dev/null || true)
          echo "$BADGING" | grep -E "^package:|application-label:" | head -3
          echo "$BADGING" | grep -q "package: name='com.teamshryne.mediyo.debug'" \
            || { echo "::error::debug APK must use .debug applicationId"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Mediyo Debug'" \
            || { echo "::error::debug APK must be labeled 'Mediyo Debug'"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediyo-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
