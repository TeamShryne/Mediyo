name: Release

# Cutting a release = pushing a tag like v1.2.3 (or Run workflow with a version).
# Produces a signed release APK + update.json for the in-app updater (GitHub only).
#
# The build itself lives in build-apk.yml, shared with the nightly track, so
# the two cannot drift in how they sign or what they produce. This file only
# decides the version, the tag and where the release lands.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 — creates and pushes tag v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Manual "Run workflow" just cuts the tag; the tag push triggers `publish`.
  cut-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semver like 0.1.0 (got '${{ inputs.version }}')"
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Mediyo $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG — the tag build will publish the release."

  publish:
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag must be like v1.2.3 (got '$TAG')"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          CODE=$(scripts/version-code.sh "$MAJOR" "$MINOR" "$PATCH" release)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk=mediyo-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "Building $TAG → versionName=$VERSION versionCode=$CODE"

      - name: Build signed APK
        uses: ./.github/workflows/build-apk.yml
        with:
          versionCode: ${{ steps.version.outputs.code }}
          versionName: ${{ steps.version.outputs.version }}
          channel: stable
          apkName: ${{ steps.version.outputs.apk }}
        secrets:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${{ github.run_id }}" -n "built-apk-${APK_NAME}" -D dist
          cp "dist/$APK_NAME" "$APK_NAME"
          SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          echo "$SHA  $APK_NAME" > "$APK_NAME.sha256"

          # The updater contract — shared with the nightly track so the two
          # cannot drift.
          scripts/make-update-json.sh "$VERSION" "$CODE" "$APK_NAME" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$APK_NAME" \
            "$SHA"

          # Changelog since previous tag. Match v* so the nightly tags, which
          # point at ordinary commits, are not mistaken for a release.
          PREV=$(git describe --tags --abbrev=0 --match "v*" "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            CHANGELOG="Changes since $PREV:"
            CHANGELOG+=$'\n'"$(git log "$PREV..$TAG" --pretty=format:'- %s (%h)' --reverse)"
          else
            CHANGELOG="First release."
            CHANGELOG+=$'\n'"$(git log -30 "$TAG" --pretty=format:'- %s (%h)' --reverse)"
          fi

          # A notes file rather than --notes: the body contains backticks and
          # $ signs, and quoting that into a shell argument is a trap.
          {
            echo "## Mediyo $TAG (versionCode $CODE)"
            echo
            echo "$CHANGELOG"
            echo
            echo "### APK"
            echo "- **$APK_NAME** — signed release (\`com.teamshryne.mediyo\`), installs side-by-side with the Debug build (\`com.teamshryne.mediyo.debug\`)."
            echo "- SHA-256: \`$SHA\`"
            echo
            echo "### In-app updater"
            echo "This release follows the updater contract (GitHub only, no server):"
            echo "- Latest version: \`GET https://api.github.com/repos/${{ github.repository }}/releases/latest\` → \`tag_name\`"
            echo "- Machine-readable: \`https://github.com/${{ github.repository }}/releases/download/$TAG/update.json\` (\`versionCode\` to compare, \`apkUrl\` to download, \`sha256\` to verify before install)."
          } > notes.md

          # Re-run safe: delete existing release for this tag if present.
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -f -a "$TAG" -m "Mediyo $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Mediyo $TAG" \
            --notes-file notes.md \
            "$APK_NAME" "$APK_NAME.sha256" update.json

      - name: Upload APK artifact (CI copy)
        uses: actions/upload-artifact@v4
        with:
          name: mediyo-release-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.version.outputs.apk }}
            update.json
          if-no-files-found: error
