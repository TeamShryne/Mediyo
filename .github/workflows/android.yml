name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel stale runs — saves runners + caches (from Strym)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  native:
    name: Native lib (cargo-ndk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Android SDK (cmdline tools, licenses accepted)
        uses: android-actions/setup-android@v4

      - name: Install NDK + platform/build-tools
        run: |
          sdkmanager --install "ndk;27.0.12077973" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Cache cargo-ndk binary (heavy — compile once)
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-rust-1.88-${{ runner.os }}-v1

      - name: Install cargo-ndk
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Rust cache (incremental — registry + target, after JNI for next hit)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build .so (arm64-v8a + armeabi-v7a + x86_64, release)
        working-directory: rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 24 -o ../app/src/main/jniLibs build --release -p mediyo-ffi

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs
          if-no-files-found: error

  apk:
    name: APK + lint
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform + build-tools
        run: |
          sdkmanager --install "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Gradle cache (heavy, cleanup unused)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs

      - name: Build debug APK + lint
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleDebug lintDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediyo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  prune:
    name: Prune stale caches
    needs: [apk]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: write
    steps:
      # Separate job so Gradle/Rust post-save steps finish first (Strym pattern)
      # Keep newest 12 (~2 runs) + always keep newest Rust cache
      - name: Keep 12 newest + newest Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          caches=$(gh api "repos/$REPO/actions/caches?per_page=100" -q '.actions_caches | sort_by(.created_at) | reverse | map({id, key})')
          newest_rust_id=$(echo "$caches" | jq -r '[.[] | select(.key | test("rust"; "i"))][0].id // empty')
          echo "newest rust cache: $newest_rust_id"
          for id in $(echo "$caches" | jq -r '.[12:][].id'); do
            if [ "$id" = "$newest_rust_id" ]; then
              echo "keeping newest rust cache $id"
              continue
            fi
            echo "deleting stale cache $id"
            gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null
          done
          echo "Prune done — kept 12 newest + rust $newest_rust_id"
