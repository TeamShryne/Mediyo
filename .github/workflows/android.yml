name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK 26.1.10909125
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk binary
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-rust-1.88-${{ runner.os }}-v1

      - name: Install cargo-ndk (cached)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Cache Rust registry + target (incremental)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/crates/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Setup Gradle 8.6 (heavy cache, no 9.x)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-cleanup: true

      - name: Build Rust (cargo-ndk -> jniLibs)
        working-directory: rust
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 24 -o ../app/src/main/jniLibs build --release -p mediyo-ffi
          ls -R ../app/src/main/jniLibs || true

      - name: Assemble Debug + Lint
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleDebug lintDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediyo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Prune caches (keep 20 newest + rust)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Listing caches..."
          gh api repos/${{ github.repository }}/actions/caches --paginate -q '.actions_caches | sort_by(.created_at) | reverse | .[] | "\(.id) \(.key) \(.created_at)"' | head -n 40 || true
          IDS=$(gh api repos/${{ github.repository }}/actions/caches --paginate -q '.actions_caches | sort_by(.created_at) | reverse | .[20:] | .[].id' 2>/dev/null || true)
          RUST_KEEP=$(gh api repos/${{ github.repository }}/actions/caches --paginate -q '.actions_caches | map(select(.key | startswith("rust-"))) | sort_by(.created_at) | reverse | .[0] | .id' 2>/dev/null || true)
          for id in $IDS; do
            if [ "$id" = "$RUST_KEEP" ]; then echo "keep rust $id"; continue; fi
            echo "deleting cache $id"
            gh api -X DELETE repos/${{ github.repository }}/actions/caches/$id || true
          done
          echo "Prune done — kept 20 newest + rust $RUST_KEEP"
