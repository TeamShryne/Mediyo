name: Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "rust/**"
      - ".github/workflows/native.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "rust/**"
  # Run after Native completes so rust changes land as fresh jniLibs +
  # bindings before the APK builds (the native bot commit itself cannot
  # retrigger workflows, hence this explicit chain).
  workflow_run:
    workflows: ["Native"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  apk:
    name: APK
    # workflow_run fires on completed (incl. failure) — only build on success.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform + build-tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle cache (heavy)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          gradle-home-cache-cleanup: true

      - name: Build debug APK + lint
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleDebug lintDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Verify debug identity (side-by-side with release)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK=$APK"
          # NB: aapt exits 1 on the pre-existing sym_def_app_icon reference,
          # so capture output and assert on what matters instead.
          BADGING=$("$BT/aapt" dump badging "$APK" 2>/dev/null || true)
          echo "$BADGING" | grep -E "^package:|application-label:" | head -3
          echo "$BADGING" | grep -q "package: name='com.teamshryne.mediyo.debug'" \
            || { echo "::error::debug APK must use .debug applicationId"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Mediyo Debug'" \
            || { echo "::error::debug APK must be labeled 'Mediyo Debug'"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediyo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  prune:
    name: Prune stale caches
    needs: [apk]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: write
    steps:
      - name: Keep 12 newest + newest Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          caches=$(gh api "repos/$REPO/actions/caches?per_page=100" -q '.actions_caches | sort_by(.created_at) | reverse | map({id, key})')
          newest_rust_id=$(echo "$caches" | jq -r '[.[] | select(.key | test("rust"; "i"))][0].id // empty')
          echo "newest rust: $newest_rust_id"
          for id in $(echo "$caches" | jq -r '.[12:][].id'); do
            if [ "$id" = "$newest_rust_id" ]; then echo "keep rust $id"; continue; fi
            echo "delete $id"
            gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null
          done
