name: Mediyo v0.5.0 Release

# Publishes the already-validated artifacts from the completed v0.5.0 dry run.
# This workflow deliberately does NOT rebuild the APK.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark v0.5.0 as a pre-release"
        type: boolean
        default: false
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v050
  cancel-in-progress: false

env:
  VERSION: 0.5.0
  TAG: v0.5.0
  DRY_RUN_ID: "34693744527"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed dry-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$DRY_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name mediyo-v0.5.0-release-dry-run \
            --dir release
          test -s release/mediyo-v0.5.0.apk
          test -s release/mediyo-v0.5.0.apk.sha256
          test -s release/update.json
          test -s release/release-notes-v0.5.0.md
          ls -lh release/

      - name: Validate artifact identity and updater URL
        run: |
          set -euo pipefail
          APK_SHA=$(cut -d' ' -f1 release/mediyo-v0.5.0.apk.sha256)
          ACTUAL_SHA=$(sha256sum release/mediyo-v0.5.0.apk | cut -d' ' -f1)
          test "$APK_SHA" = "$ACTUAL_SHA"
          grep -q '"package": "com.teamshryne.mediyo"' release/update.json
          grep -q '"version": "0.5.0"' release/update.json
          grep -q '"versionCode": 5000' release/update.json
          grep -q 'mediyo-v0.5.0.apk' release/update.json
          grep -q 'releases/download/v0.5.0/' release/update.json
          echo "Validated SHA-256: $ACTUAL_SHA"

      - name: Create v0.5.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists; refusing to overwrite it"
            exit 1
          fi
          git init release-repo
          cd release-repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Mediyo $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release from validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Mediyo $TAG" \
            --notes-file release/release-notes-v0.5.0.md \
            $PRERELEASE_FLAG \
            release/mediyo-v0.5.0.apk \
            release/mediyo-v0.5.0.apk.sha256 \
            release/update.json

      - name: Upload published release bundle as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediyo-v0.5.0-release-published
          path: |
            release/mediyo-v0.5.0.apk
            release/mediyo-v0.5.0.apk.sha256
            release/update.json
            release/release-notes-v0.5.0.md
          if-no-files-found: error
