name: Emulator

# Boots an API 34 emulator, installs the debug APK, drives it through the adb
# control surface (docs/adb-control.md) and uploads screenshots so the UI can be
# inspected without a device. Runs on every app change; dispatch it manually to
# re-collect screenshots without touching code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/emulator.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/emulator.yml'

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    name: Boot emulator + drive app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      # Pinned so the AVD cache key is stable across runs.
      API_LEVEL: '34'
      SYSTEM_IMAGE: 'system-images;android-34;google_apis;x86_64'
      # Stable location so the AVD survives between runs and can be cached.
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform + build-tools + emulator image
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "emulator" "$SYSTEM_IMAGE"
          df -h / | tail -1

      # The extracted system image is ~1.5GB and dominates the run time; the
      # Gradle cache below is the same one assembleDebug already warms.
      - name: Cache Android emulator image
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/system-images
            ${{ env.ANDROID_SDK_ROOT }}/emulator
          key: emulator-${{ env.API_LEVEL }}-${{ hashFiles('.github/workflows/emulator.yml') }}
          restore-keys: emulator-${{ env.API_LEVEL }}-

      - name: Gradle cache (heavy)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
          gradle-home-cache-cleanup: true

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleDebug --stacktrace
          ls -la app/build/outputs/apk/debug/

      # android-emulator-runner needs KVM readable by the current user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare AVD home
        run: mkdir -p "$ANDROID_AVD_HOME" && echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"

      - name: Boot emulator and drive the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          disable-animations: true
          disable-window-animations: true
          emulator-options: >-
            -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect
            -noaudio -camera-back none -camera-front none
          script: scripts/emulator-smoke.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise
        if: always()
        run: |
          if [ -f artifacts/summary.txt ]; then
            echo "### Emulator smoke" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Emulator smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi