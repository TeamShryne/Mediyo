[package]
name = "mediyo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Superfast, lightweight YouTube Music client core library"
repository = "https://github.com/shrawan/mediyo-core"

[dependencies]
ureq = { version = "3", default-features = true, features = ["gzip", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
